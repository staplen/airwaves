# Second airband slice, centred on 133.9 MHz: channels the spectrum survey keeps finding outside the 119.55 MHz
# tower/approach slice (133.900, 133.975, 134.425, 134.500 MHz), plus 134.350 (listed as Washington area helicopter
# control). Names aren't confirmed yet, so the collector labels them by frequency (template AIR_<kHz>).
split_max_file_time = 60;
split_tx_drop_shorter_than = 0.5;
devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 40;
  centerfreq = 133.9;
  correction = 0;
  channels:
  (
    { freq = 133.900; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "AIR_133900"; split_on_transmission = true; }); },
    { freq = 133.975; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "AIR_133975"; split_on_transmission = true; }); },
    { freq = 134.350; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "AIR_134350"; split_on_transmission = true; }); },
    { freq = 134.425; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "AIR_134425"; split_on_transmission = true; }); },
    { freq = 134.500; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "AIR_134500"; split_on_transmission = true; }); }
  );
});
