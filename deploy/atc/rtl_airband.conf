# One 2.56 MHz slice centred on 119.55 MHz: DCA, BWI and IAD towers plus Potomac TRACON sectors.
# Channels must stay within about ±1 MHz of centerfreq. Frequencies per FAA Chart Supplement /
# RadioReference; the filename_template is the label the collector shows (see ATC_NAMES).
split_max_file_time = 60;
split_tx_drop_shorter_than = 0.5;
devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 40;
  centerfreq = 119.55;
  correction = 0;
  channels:
  (
    { freq = 118.675; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "APP_LURAY"; split_on_transmission = true; }); },
    { freq = 118.950; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "DEP_TYSON"; split_on_transmission = true; }); },
    { freq = 119.000; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "APP_BWI"; split_on_transmission = true; }); },
    { freq = 119.100; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "DCA_TWR"; split_on_transmission = true; }); },
    { freq = 119.400; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "BWI_TWR"; split_on_transmission = true; }); },
    { freq = 119.850; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "APP_OJAAY"; split_on_transmission = true; }); },
    { freq = 120.100; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "IAD_TWR_E"; split_on_transmission = true; }); },
    { freq = 120.250; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "IAD_TWR_C"; split_on_transmission = true; }); },
    { freq = 120.450; outputs: ({ type = "file"; directory = "/recordings"; filename_template = "APP_IAD_W"; split_on_transmission = true; }); }
  );
});
